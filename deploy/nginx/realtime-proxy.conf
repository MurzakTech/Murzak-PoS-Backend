# Live updates (payment confirmations, kitchen tickets) for the till.
#
# WHY THIS IS NEEDED
# Frappe's socket server refuses a page whose address differs from the address the connection goes to
# ("Invalid origin"), and it checks every new connection by calling back to the PAGE'S OWN address.
# The tills are served from pos.murzaktech.tech (and one address per shop), while the backend is
# api.pos.murzaktech.tech, so each page address must forward two things to the backend:
#   1. the live connection itself (/socket.io/), and
#   2. the login check the socket server makes (/api/method/frappe.realtime.get_user_info).
# Tested on staging (spike 0.3, see docs/STAGING_SERVER.md): an event reached a signed-in cashier in
# 88 ms; another user received nothing; a page on a different address, a client with no login and a
# client with a wrong key were all refused.
#
# HOW TO USE
# Include this file inside the `server { ... }` block of every page address (pos.murzaktech.tech and
# each <shop>.pos.murzaktech.tech), next to the security-headers include from docs/SERVER_SECURITY_SETUP.md:
#
#     include /etc/nginx/snippets/murzak-realtime-proxy.conf;
#
# Then:  sudo nginx -t && sudo systemctl reload nginx
#
# EDIT BEFORE USE
#   - 127.0.0.1:9000 is the Frappe socket server and 127.0.0.1:8000 the Frappe web server. If this Nginx
#     is on a different machine from the bench, put that machine's address there instead.
#   - api.pos.murzaktech.tech is the backend's site name.
#
# The client (frontend) must connect to ITS OWN address, not to api.pos.murzaktech.tech, with the
# polling transport first (it can carry the Authorization header) and then let it upgrade to a WebSocket.

location /socket.io/ {
	proxy_pass http://127.0.0.1:9000;
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection $connection_upgrade;
	proxy_set_header Host $host;
	proxy_set_header Origin $http_origin;
	proxy_set_header X-Frappe-Site-Name api.pos.murzaktech.tech;
	proxy_read_timeout 3600s;   # keep quiet connections open
}

location = /api/method/frappe.realtime.get_user_info {
	proxy_pass http://127.0.0.1:8000;
	proxy_set_header Host $host;
	proxy_set_header X-Frappe-Site-Name api.pos.murzaktech.tech;
}

# Needed once, in the `http { ... }` block (for example /etc/nginx/conf.d/websocket-upgrade.conf):
#
#     map $http_upgrade $connection_upgrade {
#         default upgrade;
#         ''      close;
#     }
