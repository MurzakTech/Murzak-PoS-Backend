name: Deploy Backend
on:
  push:
    branches: [main]

# Never run two deploys at the same time: the second waits for the first
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  # A push to main used to go straight to the server. Nothing was checked first, so a failing test
  # (for example a business able to read another business's records) reached customers. The same
  # unit tests the pull request runs now have to pass before the deploy starts.
  unit-tests:
    name: Unit tests (no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install "frappe @ git+https://github.com/frappe/frappe.git@version-15"
      - run: pip install --no-deps "erpnext @ git+https://github.com/frappe/erpnext.git@version-15"
      - run: python .github/scripts/run_unit_tests.py

  deploy:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            # Stop at the first failing command, so a failed deploy shows red instead of green
            set -e

            cd ~/frappe-bench/apps/murzak_pos

            # The server must be on main with no edits of its own; otherwise refuse and say why
            branch="$(git rev-parse --abbrev-ref HEAD)"
            if [ "$branch" != "main" ]; then
              echo "::error::Server is on branch '$branch', not main. Run 'git checkout main' on the server, then re-run this deploy."
              exit 1
            fi
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "::error::Server has uncommitted edits in murzak_pos. Commit or discard them on the server, then re-run this deploy."
              git status --short --untracked-files=no
              exit 1
            fi

            # Move forward to exactly what is on GitHub, never merge or rewrite
            git fetch origin main
            if ! git merge --ff-only origin/main; then
              echo "::error::Server's main has commits that are not on GitHub. Push or remove them on the server, then re-run this deploy."
              git log --oneline origin/main..HEAD
              exit 1
            fi
            echo "Deploying $(git log --oneline -1)"

            cd ~/frappe-bench

            # Every business bought on murzaktech.tech has its own site and its own database, as well as the
            # shared site. Each one has to be migrated, or its tables, fields and print formats fall behind the
            # code (a shop built before an update never got it). One that fails does not stop the others; the
            # deploy is marked failed at the end.
            failed=""
            for dir in sites/*/; do
              site="$(basename "$dir")"
              [ -f "sites/$site/site_config.json" ] || continue
              if bench --site "$site" list-apps 2>/dev/null | awk '{print $1}' | grep -qx murzak_pos; then
                echo "Migrating $site"
                bench --site "$site" migrate || failed="$failed $site"
              fi
            done

            bench build --app murzak_pos
            bench restart

            if [ -n "$failed" ]; then
              echo "::error::Migrate failed on:$failed. The app is restarted on the new code; fix those sites and run 'bench --site <site> migrate'."
              exit 1
            fi

            echo "Deployed murzak_pos $(git -C apps/murzak_pos rev-parse --short HEAD) to every site that runs it"
