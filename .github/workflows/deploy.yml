name: Deploy Backend
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/frappe-bench/apps/techsavanna_pos
            git pull origin main
            cd ~/frappe-bench
            bench --site api.pos.murzaktech.tech migrate
            bench build --app techsavanna_pos
            bench restart
